services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      KAARIS_HOST: ${KAARIS_HOST:?KAARIS_HOST required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
    depends_on:
      - api

  api:
    build: .
    restart: unless-stopped
    read_only: true
    init: true
    env_file: .env
    environment:
      HOST: "0.0.0.0"
    networks:
      - default
      - inference
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  inference:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: [model]
    restart: unless-stopped
    mem_limit: 6g
    cpus: 3
    networks:
      - inference
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./models:/models:ro
    command:
      - --model
      - /models/${KAARIS_MODEL_FILE:-gemma-4-E4B_q4_0-it.gguf}
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - --ctx-size
      - "1536"
      - --parallel
      - "1"
      - --threads
      - "3"
      - --batch-size
      - "256"
      - --ubatch-size
      - "128"
      - --gpu-layers
      - "0"
      - --no-mmproj
      - --no-webui

networks:
  inference:
    internal: true

volumes:
  certificates:
